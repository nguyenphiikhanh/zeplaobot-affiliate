version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: saffi_app
        restart: unless-stopped
        environment:
            SERVICE_NAME: app
        volumes:
            - .:/var/www
        networks:
            - saffi_network
        depends_on:
            - db

    webserver:
        image: nginx:1.30-alpine@sha256:5f979dcfed4ce6461873f087e8c980d6e29b084b9e8776d9704a7e989b5f4898
        container_name: saffi_webserver
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./infra/nginx:/etc/nginx/conf.d/
        networks:
            - saffi_network
        depends_on:
            - app

    db:
        image: mariadb:10.11
        container_name: saffi_db
        restart: unless-stopped
        environment:
            - MYSQL_DATABASE=saffi
            - MYSQL_USER=saffi_user
            - MYSQL_PASSWORD=saffi12345
            - MYSQL_ROOT_PASSWORD=root12345
        ports:
            - "3306:3306"
        volumes:
            - ./.dbdata:/var/lib/mysql
        networks:
            - saffi_network

    phpmyadmin:
        image: phpmyadmin:5.2@sha256:7dfd52c452049bf077f5ae6d46324f5f33ea0130c16b958d9821aff5c6f812ef
        container_name: saffi_phpmyadmin
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            - PMA_HOST=db
            - PMA_PORT=3306
            - PMA_USER=root
            - PMA_PASSWORD=root12345
        networks:
            - saffi_network
        depends_on:
            - db

    redis:
        image: redis:7-alpine
        container_name: saffi_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        command: >
            redis-server
            --requirepass ${REDIS_PASSWORD}
            --maxmemory 128mb
            --maxmemory-policy allkeys-lru
        environment:
            REDIS_PASSWORD: saffi12345
        volumes:
            - redis_data:/data
        deploy:
            resources:
                limits:
                    memory: 128M

networks:
    saffi_network:
        driver: bridge

volumes:
    redis_data:
